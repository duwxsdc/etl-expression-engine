server:
  port: 8080
  
spring:
  application:
    name: etl-expression-engine
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  
  redis:
    host: 47.97.124.176
    port: 6379
    database: 0
    timeout: 2000
    password: ${REDIS_PASSWORD:redis2026!}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 10000
  
  threads:
    virtual:
      enabled: true

etl:
  engine:
    expression-timeout: 5000
    max-expression-length: 10000
    enable-sql-execution: true
    sql-readonly: true

logging:
  level:
    root: INFO
    com.etl.engine: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
