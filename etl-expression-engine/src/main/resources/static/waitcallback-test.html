<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MvelRestClient waitCallback 测试页面</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #333;
            margin-bottom: 16px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            min-height: 120px;
            font-family: 'Courier New', monospace;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-warning {
            background: #ffc107;
            color: #333;
        }
        .result-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            max-height: 400px;
            overflow-y: auto;
        }
        .result-box pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .status-success {
            color: #28a745;
        }
        .status-error {
            color: #dc3545;
        }
        .status-pending {
            color: #ffc107;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .scenario-btn {
            width: 100%;
            padding: 16px;
            text-align: left;
        }
        .scenario-btn h3 {
            margin-bottom: 4px;
        }
        .scenario-btn p {
            font-size: 12px;
            opacity: 0.8;
            font-weight: normal;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .time-info {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
        .callback-log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 12px;
        }
        .callback-log .log-entry {
            margin-bottom: 4px;
        }
        .callback-log .log-time {
            color: #6a9955;
        }
        .callback-log .log-event {
            color: #569cd6;
        }
        .callback-log .log-data {
            color: #ce9178;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 MvelRestClient waitCallback 测试页面</h1>
        
        <div class="grid">
            <div class="card">
                <h2>📋 快速测试场景</h2>
                <button class="btn btn-primary scenario-btn" onclick="testScenario('success')">
                    <h3>✅ 场景1: 成功回调</h3>
                    <p>发起异步请求，2秒后收到成功回调</p>
                </button>
                <button class="btn btn-danger scenario-btn" onclick="testScenario('error')">
                    <h3>❌ 场景2: 错误回调</h3>
                    <p>第三方返回错误状态的回调</p>
                </button>
                <button class="btn btn-warning scenario-btn" onclick="testScenario('timeout')">
                    <h3>⏰ 场景3: 超时场景</h3>
                    <p>第三方不回调，等待超时</p>
                </button>
                <button class="btn btn-secondary scenario-btn" onclick="testScenario('duplicate')">
                    <h3>🔄 场景4: 重复回调</h3>
                    <p>测试重复回调被忽略</p>
                </button>
                <button class="btn btn-success scenario-btn" onclick="testScenario('delayed')">
                    <h3>🐢 场景5: 延迟回调</h3>
                    <p>5秒后收到延迟回调</p>
                </button>
            </div>
            
            <div class="card">
                <h2>⚙️ 自定义测试</h2>
                <div class="form-group">
                    <label>延迟时间 (ms):</label>
                    <input type="number" id="delayMs" value="2000" min="0" max="60000">
                </div>
                <div class="form-group">
                    <label>超时时间 (ms):</label>
                    <input type="number" id="timeoutMs" value="30000" min="1000" max="120000">
                </div>
                <div class="form-group">
                    <label>回调状态:</label>
                    <select id="callbackStatus">
                        <option value="SUCCESS">SUCCESS - 成功</option>
                        <option value="ERROR">ERROR - 错误</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>回调数据 (JSON):</label>
                    <textarea id="callbackData">{
  "result": "processed",
  "message": "处理完成"
}</textarea>
                </div>
                <button class="btn btn-primary" onclick="runCustomTest()">▶️ 执行测试</button>
                <button class="btn btn-secondary" onclick="clearResults()">🗑️ 清除结果</button>
            </div>
        </div>
        
        <div class="card">
            <h2>📝 MVEL 表达式</h2>
            <div class="form-group">
                <label>当前测试表达式:</label>
                <textarea id="mvelExpression" readonly></textarea>
            </div>
        </div>
        
        <div class="card">
            <h2>📊 执行结果</h2>
            <div id="executionStatus" class="status-pending">等待执行...</div>
            <div class="time-info" id="timeInfo"></div>
            <div class="result-box">
                <pre id="resultOutput">点击上方按钮开始测试</pre>
            </div>
            <div class="callback-log" id="callbackLog"></div>
        </div>
        
        <div class="card">
            <h2>📈 服务状态</h2>
            <button class="btn btn-secondary" onclick="checkStatus()">🔄 刷新状态</button>
            <div class="result-box">
                <pre id="statusOutput">点击刷新状态</pre>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/test';
        const MOCK_BASE = '/mock/third';
        
        let testStartTime = null;
        let logEntries = [];
        
        function addLog(event, data) {
            const time = new Date().toLocaleTimeString();
            logEntries.push({ time, event, data });
            renderLog();
        }
        
        function renderLog() {
            const logEl = document.getElementById('callbackLog');
            logEl.innerHTML = logEntries.map(entry => 
                `<div class="log-entry">
                    <span class="log-time">[${entry.time}]</span> 
                    <span class="log-event">${entry.event}</span>: 
                    <span class="log-data">${entry.data}</span>
                </div>`
            ).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        function clearLog() {
            logEntries = [];
            renderLog();
        }
        
        function updateStatus(status, message) {
            const statusEl = document.getElementById('executionStatus');
            statusEl.className = 'status-' + status;
            statusEl.textContent = message;
        }
        
        function updateTimeInfo(duration) {
            const timeEl = document.getElementById('timeInfo');
            timeEl.textContent = `执行耗时: ${duration}ms`;
        }
        
        function updateExpression(expr) {
            document.getElementById('mvelExpression').value = expr;
        }
        
        function updateResult(data) {
            document.getElementById('resultOutput').textContent = JSON.stringify(data, null, 2);
        }
        
        function clearResults() {
            clearLog();
            updateStatus('pending', '等待执行...');
            document.getElementById('timeInfo').textContent = '';
            document.getElementById('resultOutput').textContent = '点击上方按钮开始测试';
        }
        
        async function executeMvel(expression) {
            const startTime = Date.now();
            testStartTime = startTime;
            
            addLog('开始执行', new Date().toLocaleTimeString());
            updateStatus('pending', '⏳ 执行中...');
            updateExpression(expression);
            
            try {
                const response = await fetch(`${API_BASE}/run-mvel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ expression })
                });
                
                const result = await response.json();
                const duration = Date.now() - startTime;
                
                updateTimeInfo(duration);
                updateResult(result);
                
                if (result.success) {
                    updateStatus('success', '✅ 执行成功');
                    addLog('执行完成', `耗时 ${duration}ms`);
                } else {
                    updateStatus('error', '❌ 执行失败: ' + result.error);
                    addLog('执行失败', result.error);
                }
                
                return result;
            } catch (error) {
                const duration = Date.now() - startTime;
                updateTimeInfo(duration);
                updateStatus('error', '❌ 请求失败: ' + error.message);
                updateResult({ error: error.message });
                addLog('请求失败', error.message);
                return null;
            }
        }
        
        async function testScenario(scenario) {
            clearResults();
            
            let expression = '';
            let delayMs = 2000;
            
            switch (scenario) {
                case 'success':
                    delayMs = 2000;
                    expression = buildExpression(delayMs, 30000, 'SUCCESS', { result: 'processed', data: { userId: 123, name: '张三' } });
                    break;
                case 'error':
                    delayMs = 2000;
                    expression = buildExpression(delayMs, 30000, 'ERROR', { message: '处理失败：数据格式错误', errorCode: 'INVALID_DATA' });
                    break;
                case 'timeout':
                    expression = `RestClient.post("http://localhost:8080${MOCK_BASE}/async/config?timeout=true&delayMs=60000")
    .bodyJson({"eventId": "timeout-test-" + System.currentTimeMillis(), "targetIp": "127.0.0.1", "targetPort": 8080})
    .bindCallback(5000)
    .execute()
    .waitCallback()`;
                    addLog('超时测试', '设置5秒超时，第三方不回调');
                    break;
                case 'duplicate':
                    delayMs = 1000;
                    expression = buildExpression(delayMs, 30000, 'SUCCESS', { result: 'first-callback' });
                    addLog('重复回调测试', '将手动触发第二次回调');
                    break;
                case 'delayed':
                    delayMs = 5000;
                    expression = buildExpression(delayMs, 30000, 'SUCCESS', { result: 'delayed-callback', delayMs: 5000 });
                    addLog('延迟回调测试', '设置5秒延迟');
                    break;
            }
            
            const result = await executeMvel(expression);
            
            if (scenario === 'duplicate' && result && result.success) {
                setTimeout(async () => {
                    addLog('发送重复回调', '尝试第二次回调');
                    try {
                        const eventId = result.result?.eventId || 'unknown';
                        await fetch('/api/public/callback', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                eventId: eventId,
                                targetIp: '127.0.0.1',
                                targetPort: 8080,
                                payload: { result: 'second-callback-should-be-ignored' },
                                status: 'SUCCESS'
                            })
                        });
                        addLog('重复回调结果', '已被忽略（预期行为）');
                    } catch (e) {
                        addLog('重复回调错误', e.message);
                    }
                }, 2000);
            }
        }
        
        function buildExpression(delayMs, timeoutMs, status, payload) {
            const eventIdExpr = `"test-" + System.currentTimeMillis()`;
            const payloadJson = JSON.stringify(payload).replace(/"/g, '\\"');
            
            return `RestClient.post("http://localhost:8080${MOCK_BASE}/async")
    .bodyJson({
        "eventId": ${eventIdExpr},
        "targetIp": "127.0.0.1",
        "targetPort": 8080,
        "delayMs": ${delayMs},
        "status": "${status}",
        "payload": ${JSON.stringify(payload)}
    })
    .bindCallback(${timeoutMs})
    .execute()
    .waitCallback()`;
        }
        
        async function runCustomTest() {
            clearResults();
            
            const delayMs = document.getElementById('delayMs').value;
            const timeoutMs = document.getElementById('timeoutMs').value;
            const status = document.getElementById('callbackStatus').value;
            const callbackDataStr = document.getElementById('callbackData').value;
            
            let callbackData;
            try {
                callbackData = JSON.parse(callbackDataStr);
            } catch (e) {
                updateStatus('error', '❌ JSON格式错误');
                updateResult({ error: '回调数据JSON格式不正确: ' + e.message });
                return;
            }
            
            const expression = buildExpression(delayMs, timeoutMs, status, callbackData);
            addLog('自定义测试', `延迟=${delayMs}ms, 超时=${timeoutMs}ms, 状态=${status}`);
            
            await executeMvel(expression);
        }
        
        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE}/restclient/status`);
                const data = await response.json();
                document.getElementById('statusOutput').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('statusOutput').textContent = '获取状态失败: ' + error.message;
            }
        }
        
        // 页面加载时检查状态
        window.onload = function() {
            checkStatus();
        };
    </script>
</body>
</html>
