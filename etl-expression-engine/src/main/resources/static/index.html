<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETL表达式引擎控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2d2d2d;
            padding: 10px 20px;
            border-bottom: 1px solid #3c3c3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 16px;
            color: #569cd6;
        }

        .session-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .session-id {
            color: #4ec9b0;
            font-size: 13px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6e6e6e;
        }

        .status-dot.connected {
            background: #4ec9b0;
        }

        .status-dot.disconnected {
            background: #f14c4c;
        }

        .console-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .console-output {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #1e1e1e;
        }

        .log-entry {
            margin-bottom: 8px;
            line-height: 1.5;
            font-size: 13px;
        }

        .log-entry .timestamp {
            color: #6e6e6e;
            margin-right: 10px;
        }

        .log-entry.info {
            color: #dcdcaa;
        }

        .log-entry.success {
            color: #4ec9b0;
        }

        .log-entry.error {
            color: #f14c4c;
        }

        .log-entry.system {
            color: #569cd6;
        }

        .log-entry .input {
            color: #9cdcfe;
        }

        .log-entry .result {
            color: #ce9178;
        }

        .log-entry .label {
            color: #c586c0;
            margin-right: 5px;
        }

        .input-container {
            background: #2d2d2d;
            padding: 15px;
            border-top: 1px solid #3c3c3c;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .prompt {
            color: #4ec9b0;
            font-weight: bold;
        }

        #expressionInput {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            color: #d4d4d4;
            padding: 10px;
            font-family: inherit;
            font-size: 13px;
            border-radius: 4px;
            outline: none;
        }

        #expressionInput:focus {
            border-color: #569cd6;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            background: #0e639c;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1177bb;
        }

        button:disabled {
            background: #3c3c3c;
            color: #6e6e6e;
            cursor: not-allowed;
        }

        button.clear {
            background: #5a5a5a;
        }

        button.clear:hover {
            background: #6e6e6e;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .quick-actions {
            display: flex;
            gap: 5px;
        }

        .quick-action {
            background: #3c3c3c;
            color: #d4d4d4;
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
        }

        .quick-action:hover {
            background: #4e4e4e;
        }

        .variables-panel {
            position: fixed;
            right: 0;
            top: 50px;
            width: 300px;
            background: #2d2d2d;
            border-left: 1px solid #3c3c3c;
            height: calc(100vh - 50px);
            transform: translateX(100%);
            transition: transform 0.3s;
            overflow-y: auto;
        }

        .variables-panel.open {
            transform: translateX(0);
        }

        .panel-header {
            background: #3c3c3c;
            padding: 10px 15px;
            font-size: 13px;
            color: #569cd6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-panel {
            background: transparent;
            color: #d4d4d4;
            padding: 2px 8px;
        }

        .variable-item {
            padding: 8px 15px;
            border-bottom: 1px solid #3c3c3c;
            font-size: 12px;
        }

        .variable-name {
            color: #9cdcfe;
        }

        .variable-value {
            color: #ce9178;
            margin-left: 10px;
        }

        .toggle-panel {
            background: transparent;
            color: #d4d4d4;
            padding: 4px 8px;
            font-size: 12px;
        }

        .json-output {
            background: #252526;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }

        .separator {
            color: #3c3c3c;
            margin: 10px 0;
            border-bottom: 1px dashed #3c3c3c;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ETL Expression Engine Console</h1>
        <div class="session-info">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connected</span>
            </div>
            <span class="session-id" id="sessionId">Session: --</span>
            <button class="toggle-panel" onclick="toggleVariablesPanel()">Variables</button>
        </div>
    </div>

    <div class="console-container">
        <div class="console-output" id="consoleOutput"></div>
        
        <div class="input-container">
            <div class="toolbar">
                <div class="quick-actions">
                    <button class="quick-action" onclick="insertExample('a=100')">a=100</button>
                    <button class="quick-action" onclick="insertExample('a+b')">a+b</button>
                    <button class="quick-action" onclick="insertExample('flag=true')">flag=true</button>
                    <button class="quick-action" onclick="insertExample('name="etl"')">name="etl"</button>
                    <button class="quick-action" onclick="insertExample('a>50 ? "big" : "small"')">三元运算</button>
                    <button class="quick-action" onclick="insertExample('SQL: SELECT 1 as test')">SQL查询</button>
                </div>
                <button class="clear" onclick="clearConsole()">Clear</button>
            </div>
            <div class="input-wrapper">
                <span class="prompt">&gt;</span>
                <input type="text" id="expressionInput" placeholder="输入表达式，按Enter执行..." 
                       onkeypress="handleKeyPress(event)">
                <div class="button-group">
                    <button id="executeBtn">Execute</button>
                </div>
            </div>
        </div>
    </div>

    <div class="variables-panel" id="variablesPanel">
        <div class="panel-header">
            <span>Session Variables</span>
            <button class="close-panel" onclick="toggleVariablesPanel()">×</button>
        </div>
        <div id="variablesList"></div>
    </div>

    <script>
        // 生成全局唯一SessionId
        let currentSessionId = localStorage.getItem('etl-session-id');
        if (!currentSessionId) {
            currentSessionId = 'ETL-' + Date.now().toString(36) + Math.random().toString(36).substr(2, 9).toUpperCase();
            localStorage.setItem('etl-session-id', currentSessionId);
        }
        
        let variables = {};
        
        function log(message, type = 'info') {
            const output = document.getElementById('consoleOutput');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            
            if (type === 'input') {
                entry.innerHTML = `<span class="timestamp">[${timestamp}]</span><span class="input">${escapeHtml(message)}</span>`;
            } else if (type === 'result') {
                entry.innerHTML = `<span class="timestamp">[${timestamp}]</span><span class="label">Result:</span><span class="result">${escapeHtml(message)}</span>`;
            } else {
                entry.innerHTML = `<span class="timestamp">[${timestamp}]</span>${message}`;
            }
            
            output.appendChild(entry);
            output.scrollTop = output.scrollHeight;
        }

        function logJson(data, type = 'result') {
            const output = document.getElementById('consoleOutput');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const json = JSON.stringify(data, null, 2);
            
            entry.innerHTML = `<span class="timestamp">[${timestamp}]</span><div class="json-output">${escapeHtml(json)}</div>`;
            
            output.appendChild(entry);
            output.scrollTop = output.scrollHeight;
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') {
                text = String(text);
            }
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const executeBtn = document.getElementById('executeBtn');

            if (connected) {
                dot.className = 'status-dot connected';
                text.textContent = 'Connected';
                executeBtn.disabled = false;
            } else {
                dot.className = 'status-dot disconnected';
                text.textContent = 'Disconnected';
                executeBtn.disabled = true;
            }
        }

        function toggleVariablesPanel() {
            const panel = document.getElementById('variablesPanel');
            panel.classList.toggle('open');
        }

        function insertExample(text) {
            document.getElementById('expressionInput').value = text;
            document.getElementById('expressionInput').focus();
        }

        function clearConsole() {
            document.getElementById('consoleOutput').innerHTML = '';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                executeExpression();
            }
        }

        function formatValue(value) {
            if (value === null) return 'null';
            if (typeof value === 'string') return `"${value}"`;
            if (typeof value === 'object') return JSON.stringify(value);
            return String(value);
        }

        function updateVariablesPanel() {
            const list = document.getElementById('variablesList');
            list.innerHTML = '';

            if (Object.keys(variables).length === 0) {
                list.innerHTML = '<div class="variable-item" style="color: #6e6e6e;">No variables defined</div>';
                return;
            }

            for (const [name, value] of Object.entries(variables)) {
                const item = document.createElement('div');
                item.className = 'variable-item';
                item.innerHTML = `<span class="variable-name">${escapeHtml(name)}:</span><span class="variable-value">${escapeHtml(formatValue(value))}</span>`;
                list.appendChild(item);
            }
        }

        async function executeExpression() {
            const input = document.getElementById('expressionInput');
            const expression = input.value.trim();

            if (!expression) {
                return;
            }

            log(`> ${expression}`, 'input');

            try {
                const response = await fetch('/etl/expression/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                        'X-Session-Id': currentSessionId
                    },
                    body: expression
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                // 更新会话ID显示
                document.getElementById('sessionId').textContent = `Session: ${result.sessionId}`;
                
                if (result.success) {
                    if (result.finalResult !== null && result.finalResult !== '') {
                        const resultStr = typeof result.finalResult === 'object' 
                            ? JSON.stringify(result.finalResult, null, 2) 
                            : String(result.finalResult);
                        log(`Result: ${resultStr}`, 'result');
                    }

                    if (result.contextVars && Object.keys(result.contextVars).length > 0) {
                        Object.assign(variables, result.contextVars);
                        updateVariablesPanel();
                        
                        const varStr = Object.entries(result.contextVars)
                            .map(([k, v]) => `${k}=${formatValue(v)}`)
                            .join(', ');
                        log(`Assigned: ${varStr}`, 'info');
                    }
                } else {
                    log(`Error: ${result.errorMsg}`, 'error');
                }
            } catch (error) {
                log(`Request failed: ${error.message}`, 'error');
            }
            
            input.value = '';
        }

        // 初始化
        window.onload = function() {
            log('ETL Expression Engine Console Ready', 'system');
            log(`Session ID: ${currentSessionId}`, 'system');
            document.getElementById('sessionId').textContent = `Session: ${currentSessionId}`;
            updateConnectionStatus(true);
            updateVariablesPanel();
        };

        // 页面卸载时保存会话ID
        window.onbeforeunload = function() {
            localStorage.setItem('etl-session-id', currentSessionId);
        };
    </script>
</body>
</html>
