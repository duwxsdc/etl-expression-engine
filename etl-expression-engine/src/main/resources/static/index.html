<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETL表达式引擎控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2d2d2d;
            padding: 10px 20px;
            border-bottom: 1px solid #3c3c3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 16px;
            color: #569cd6;
        }

        .session-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .session-id {
            color: #4ec9b0;
            font-size: 13px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6e6e6e;
        }

        .status-dot.connected {
            background: #4ec9b0;
        }

        .status-dot.disconnected {
            background: #f14c4c;
        }

        .console-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .console-output {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #1e1e1e;
        }

        .log-entry {
            margin-bottom: 8px;
            line-height: 1.5;
            font-size: 13px;
        }

        .log-entry .timestamp {
            color: #6e6e6e;
            margin-right: 10px;
        }

        .log-entry.info {
            color: #dcdcaa;
        }

        .log-entry.success {
            color: #4ec9b0;
        }

        .log-entry.error {
            color: #f14c4c;
        }

        .log-entry.system {
            color: #569cd6;
        }

        .log-entry .input {
            color: #9cdcfe;
        }

        .log-entry .result {
            color: #ce9178;
        }

        .log-entry .label {
            color: #c586c0;
            margin-right: 5px;
        }

        .input-container {
            background: #2d2d2d;
            padding: 15px;
            border-top: 1px solid #3c3c3c;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .prompt {
            color: #4ec9b0;
            font-weight: bold;
        }

        #expressionInput {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            color: #d4d4d4;
            padding: 10px;
            font-family: inherit;
            font-size: 13px;
            border-radius: 4px;
            outline: none;
        }

        #expressionInput:focus {
            border-color: #569cd6;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            background: #0e639c;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1177bb;
        }

        button:disabled {
            background: #3c3c3c;
            color: #6e6e6e;
            cursor: not-allowed;
        }

        button.clear {
            background: #5a5a5a;
        }

        button.clear:hover {
            background: #6e6e6e;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .quick-actions {
            display: flex;
            gap: 5px;
        }

        .quick-action {
            background: #3c3c3c;
            color: #d4d4d4;
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
        }

        .quick-action:hover {
            background: #4e4e4e;
        }

        .variables-panel {
            position: fixed;
            right: 0;
            top: 50px;
            width: 300px;
            background: #2d2d2d;
            border-left: 1px solid #3c3c3c;
            height: calc(100vh - 50px);
            transform: translateX(100%);
            transition: transform 0.3s;
            overflow-y: auto;
        }

        .variables-panel.open {
            transform: translateX(0);
        }

        .panel-header {
            background: #3c3c3c;
            padding: 10px 15px;
            font-size: 13px;
            color: #569cd6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-panel {
            background: transparent;
            color: #d4d4d4;
            padding: 2px 8px;
        }

        .variable-item {
            padding: 8px 15px;
            border-bottom: 1px solid #3c3c3c;
            font-size: 12px;
        }

        .variable-name {
            color: #9cdcfe;
        }

        .variable-value {
            color: #ce9178;
            margin-left: 10px;
        }

        .toggle-panel {
            background: transparent;
            color: #d4d4d4;
            padding: 4px 8px;
            font-size: 12px;
        }

        .json-output {
            background: #252526;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }

        .separator {
            color: #3c3c3c;
            margin: 10px 0;
            border-bottom: 1px dashed #3c3c3c;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ETL Expression Engine Console</h1>
        <div class="session-info">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <span class="session-id" id="sessionId">Session: --</span>
            <button class="toggle-panel" onclick="toggleVariablesPanel()">Variables</button>
        </div>
    </div>

    <div class="console-container">
        <div class="console-output" id="consoleOutput"></div>
        
        <div class="input-container">
            <div class="toolbar">
                <div class="quick-actions">
                    <button class="quick-action" onclick="insertExample('a=100')">a=100</button>
                    <button class="quick-action" onclick="insertExample('a+b')">a+b</button>
                    <button class="quick-action" onclick="insertExample('flag=true')">flag=true</button>
                    <button class="quick-action" onclick="insertExample('name=\"etl\"')">name="etl"</button>
                    <button class="quick-action" onclick="insertExample('a>50 ? \"big\" : \"small\"')">三元运算</button>
                    <button class="quick-action" onclick="insertExample('SQL: SELECT 1 as test')">SQL查询</button>
                </div>
                <button class="clear" onclick="clearConsole()">Clear</button>
            </div>
            <div class="input-wrapper">
                <span class="prompt">&gt;</span>
                <input type="text" id="expressionInput" placeholder="输入表达式，按Enter执行..." 
                       onkeypress="handleKeyPress(event)">
                <div class="button-group">
                    <button id="executeBtn" onclick="executeExpression()">Execute</button>
                    <button id="connectBtn" onclick="toggleConnection()">Connect</button>
                </div>
            </div>
        </div>
    </div>

    <div class="variables-panel" id="variablesPanel">
        <div class="panel-header">
            <span>Session Variables</span>
            <button class="close-panel" onclick="toggleVariablesPanel()">×</button>
        </div>
        <div id="variablesList"></div>
    </div>

    <script>
        let ws = null;
        let currentSessionId = null;
        let variables = {};

        function log(message, type = 'info') {
            const output = document.getElementById('consoleOutput');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            
            if (type === 'input') {
                entry.innerHTML = `<span class="timestamp">[${timestamp}]</span><span class="input">${escapeHtml(message)}</span>`;
            } else if (type === 'result') {
                entry.innerHTML = `<span class="timestamp">[${timestamp}]</span><span class="label">Result:</span><span class="result">${escapeHtml(message)}</span>`;
            } else {
                entry.innerHTML = `<span class="timestamp">[${timestamp}]</span>${message}`;
            }
            
            output.appendChild(entry);
            output.scrollTop = output.scrollHeight;
        }

        function logJson(data, type = 'result') {
            const output = document.getElementById('consoleOutput');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const json = JSON.stringify(data, null, 2);
            
            entry.innerHTML = `<span class="timestamp">[${timestamp}]</span><div class="json-output">${escapeHtml(json)}</div>`;
            
            output.appendChild(entry);
            output.scrollTop = output.scrollHeight;
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') {
                text = String(text);
            }
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const connectBtn = document.getElementById('connectBtn');
            const executeBtn = document.getElementById('executeBtn');

            if (connected) {
                dot.className = 'status-dot connected';
                text.textContent = 'Connected';
                connectBtn.textContent = 'Disconnect';
                executeBtn.disabled = false;
            } else {
                dot.className = 'status-dot disconnected';
                text.textContent = 'Disconnected';
                connectBtn.textContent = 'Connect';
                executeBtn.disabled = true;
            }
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            //const wsUrl = `${protocol}//${window.location.host}/ws/expression`;
const wsUrl = `${protocol}//localhost:8080/ws/expression`;
            log('Connecting to ' + wsUrl, 'system');

            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                log('WebSocket connection established', 'success');
                updateConnectionStatus(true);
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    log('Parse error: ' + e.message, 'error');
                }
            };

            ws.onerror = function(error) {
                log('WebSocket error', 'error');
            };

            ws.onclose = function() {
                log('WebSocket connection closed', 'system');
                updateConnectionStatus(false);
                currentSessionId = null;
                document.getElementById('sessionId').textContent = 'Session: --';
                variables = {};
                updateVariablesPanel();
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function toggleConnection() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                disconnect();
            } else {
                connect();
            }
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'SESSION':
                    currentSessionId = data.sessionId;
                    document.getElementById('sessionId').textContent = `Session: ${currentSessionId}`;
                    log(`Session established: ${currentSessionId}`, 'success');
                    break;
                case 'RESULT':
                    handleResult(data.data);
                    break;
                case 'ERROR':
                    log(`Error: ${data.content}`, 'error');
                    break;
                case 'HEARTBEAT':
                    break;
            }
        }

        function handleResult(data) {
            if (data.success) {
                log(`Expression: ${data.expression}`, 'input');
                
                if (data.result !== null && data.result !== '') {
                    const resultStr = typeof data.result === 'object' 
                        ? JSON.stringify(data.result, null, 2) 
                        : String(data.result);
                    log(`Result: ${resultStr}`, 'result');
                }

                if (data.assignedVariables && Object.keys(data.assignedVariables).length > 0) {
                    Object.assign(variables, data.assignedVariables);
                    updateVariablesPanel();
                    
                    const varStr = Object.entries(data.assignedVariables)
                        .map(([k, v]) => `${k}=${formatValue(v)}`)
                        .join(', ');
                    log(`Assigned: ${varStr}`, 'info');
                }
            } else {
                log(`Error: ${data.errorMessage}`, 'error');
            }
        }

        function formatValue(value) {
            if (value === null) return 'null';
            if (typeof value === 'string') return `"${value}"`;
            if (typeof value === 'object') return JSON.stringify(value);
            return String(value);
        }

        function executeExpression() {
            const input = document.getElementById('expressionInput');
            const expression = input.value.trim();

            if (!expression) {
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected. Please connect first.', 'error');
                return;
            }

            log(`> ${expression}`, 'input');

            const message = {
                type: 'EXECUTE',
                content: expression,
                timestamp: new Date().toISOString()
            };

            ws.send(JSON.stringify(message));
            input.value = '';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                executeExpression();
            }
        }

        function insertExample(text) {
            document.getElementById('expressionInput').value = text;
            document.getElementById('expressionInput').focus();
        }

        function clearConsole() {
            document.getElementById('consoleOutput').innerHTML = '';
        }

        function toggleVariablesPanel() {
            const panel = document.getElementById('variablesPanel');
            panel.classList.toggle('open');
        }

        function updateVariablesPanel() {
            const list = document.getElementById('variablesList');
            list.innerHTML = '';

            if (Object.keys(variables).length === 0) {
                list.innerHTML = '<div class="variable-item" style="color: #6e6e6e;">No variables defined</div>';
                return;
            }

            for (const [name, value] of Object.entries(variables)) {
                const item = document.createElement('div');
                item.className = 'variable-item';
                item.innerHTML = `<span class="variable-name">${escapeHtml(name)}:</span><span class="variable-value">${escapeHtml(formatValue(value))}</span>`;
                list.appendChild(item);
            }
        }

        window.onload = function() {
            log('ETL Expression Engine Console Ready', 'system');
            log('Click "Connect" to start a session', 'system');
            updateVariablesPanel();
        };

        window.onbeforeunload = function() {
            if (ws) {
                ws.close();
            }
        };
    </script>
</body>
</html>
