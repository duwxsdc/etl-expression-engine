server:
  port: 8080

spring:
  application:
    name: etl-expression-engine
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

rocketmq:
  name-server: localhost:9876
  producer:
    group: etl-expression-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

etl:
  engine:
    node-id: ${HOSTNAME:node-1}
    expression-timeout: 5000
    max-expression-length: 10000
    enable-sql-execution: true
    sql-readonly: true
    broadcast-topic: mvel-broadcast
    idempotent-window-seconds: 30

logging:
  level:
    root: INFO
    com.etl.engine: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
