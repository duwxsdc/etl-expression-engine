server:
  port: 8080
  
spring:
  application:
    name: etl-expression-engine
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  
  data:
    redis:
      host: 47.97.124.176
      port: 6379
      database: 0
      timeout: 20000
      password: ${REDIS_PASSWORD:redis2026!}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 10000
  
  threads:
    virtual:
      enabled: true

etl:
  engine:
    expression-timeout: 5000
    max-expression-length: 10000
    enable-sql-execution: true
    sql-readonly: true
    
    security:
      sandbox:
        enabled: true
        max-expression-size: 50000
        max-loop-count: 10
        max-nesting-depth: 20
        forbidden-keywords:
          - import
          - package
          - interface
          - enum
          - try
          - catch
          - finally
          - throw
          - throws
          - synchronized
          - volatile
          - transient
          - native
          - strictfp
        forbidden-classes:
          - Runtime
          - ProcessBuilder
          - System
          - Class
          - Method
          - Field
          - Constructor
          - java.lang.reflect
        dangerous-patterns:
          - "while\\s*\\(\\s*true\\s*\\)"
          - "for\\s*\\(.*;\\s*true\\s*;"
          - "Runtime\\.getRuntime"
          - "ProcessBuilder"
          - "System\\.exit"
          - "Class\\.forName"
          - "getMethod"
          - "invoke"
    
    token:
      default-retries: 3
      initial-delay-ms: 1000
      backoff-factor: 2.0
      refresh-buffer-ms: 60000
      expiry-buffer-seconds: 300
    
    crypto:
      aes-key-size: 256
      rsa-key-size: 2048
      gcm-iv-length: 12
      gcm-tag-length: 128
      master-key-env: ETL_CRYPTO_MASTER_KEY
    
    callback:
      max-retries: 3
      retry-interval-ms: 1000
      max-delay-ms: 500
      log-retention-days: 30
      executor-pool-size: 4

logging:
  level:
    root: INFO
    com.etl.engine: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
